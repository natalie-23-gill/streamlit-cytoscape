[project]
name = "streamlit-cytoscape"
version = "0.2.1"
description = "A flexible, customizable, Streamlit component for interactive graph visualization using Cytoscape.js"
authors = [{ name = "Natalie Gill" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["streamlit>=0.63"]

[dependency-groups]
dev = [
    "black>=26.0,<27.0",
    "flake8>=7.0,<8.0",
    "mypy>=2.0,<3.0",
    "pytest>=9.0,<10.0",
    "pytest-playwright>=0.8,<0.9",
    "pytest-rerunfailures>=16.0,<17.0",
    "networkx>=3.0",
]

[tool.black]
line-length = 79

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Force-include the bundled frontend build, which is gitignored but must
# ship in the sdist and wheel.
artifacts = ["src/streamlit_cytoscape/frontend/build/**/*"]

[tool.hatch.build.targets.wheel]
packages = ["src/streamlit_cytoscape"]
